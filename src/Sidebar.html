<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font-family: Arial, sans-serif; font-size: 13px; color: #202124; margin: 14px; }
      h2 { font-size: 15px; margin: 0 0 4px; }
      p.sub { color: #5f6368; margin: 0 0 16px; line-height: 1.4; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      .val { font-weight: 400; color: #5f6368; }
      input[type=range] { width: 100%; }
      input[type=number] { width: 70px; padding: 4px; }
      button {
        margin-top: 18px; width: 100%; padding: 9px;
        background: #1a73e8; color: #fff; border: 0; border-radius: 4px;
        font-size: 13px; font-weight: 600; cursor: pointer;
      }
      button:disabled { background: #9aa0a6; cursor: default; }
      #status { margin-top: 14px; font-size: 12px; line-height: 1.4; min-height: 16px; }
      #status.ok { color: #188038; }
      #status.err { color: #c5221f; }
    </style>
  </head>
  <body>
    <h2>Pack images</h2>
    <p class="sub">Arranges every image in this document into tidy rows that fill the page width, no more one-per-line gaps.</p>

    <label>Image size <span class="val" id="sizeVal">170 pt</span></label>
    <input type="range" id="size" min="90" max="300" step="10" value="170"
           oninput="document.getElementById('sizeVal').textContent = this.value + ' pt'" />

    <label>Spacing between images</label>
    <input type="number" id="gap" min="0" max="24" step="1" value="6" /> <span class="val">pt</span>

    <button id="go" onclick="run()">Pack images</button>
    <div id="status"></div>

    <script>
      function run() {
        var btn = document.getElementById('go');
        var status = document.getElementById('status');
        btn.disabled = true;
        status.className = '';
        status.textContent = 'Packing...';
        var settings = {
          targetHeight: Number(document.getElementById('size').value),
          gap: Number(document.getElementById('gap').value),
        };
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            status.className = res.ok ? 'ok' : 'err';
            status.textContent = res.message;
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            status.className = 'err';
            status.textContent = 'Something went wrong: ' + err.message;
          })
          .packImages(settings);
      }
    </script>
  </body>
</html>
